<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>layout</title>
  <link rel="stylesheet" href="styles/style2.css">
</head>

<body>

<header class="header">
  <div class="split-title">
    <span class="first-string">
      <h1></h1>
      <p class="back-string"></p>
      <p class="back-string"></p>
    </span>
  </div>
</header>

<nav>
  <ul class="topmenu">
    <li><a class="active"></a></li>
    <li><a></a></li>
    <li>
      <a class="down"></a>
      <ul class="submenu">
        <li><a></a></li>
        <li><a></a></li>
        <li><a></a></li>
        <li><a></a></li>
      </ul>
    </li>
    <li>
      <a class="down"></a>
      <ul class="submenu">
        <li><a></a></li>
        <li><a></a></li>
        <li><a></a></li>
        <li><a></a></li>
      </ul>
    </li>
    <li><a></a></li>
  </ul>
</nav>

<main>

  <article></article>

  <div class="slider-container">

  <div class="slider-track">

    <section class="column" id="column-1"></section>
    <section class="column" id="column-2"></section>
    <section class="column" id="column-3"></section>

  </div>

  <button class="scroll-btn prev"></button>
  <button class="scroll-btn next"></button>

</div>

  <aside></aside>

</main>

<div class="feedback">
  <form id="feedbackForm">

    <div class="form-group">
      <input type="text" id="userName" name="name" />
      <label for="userName"></label>
    </div>

    <div class="form-group">
      <input type="email" id="userEmail" name="email" />
      <label for="userEmail"></label>
    </div>

    <textarea id="message"></textarea>

    <button type="button"></button>

  </form>
</div>

<footer>

  <div class="adresses">
    <p></p>
    <p></p>
    <a></a>
  </div>

  <div class="downHeader">
    <h2 class="footer"></h2>
    <a class="privacy"></a>
  </div>

  <div class="links">
    <a class="icon-link"></a>
    <a class="icon-link"></a>
    <a class="icon-link"></a>
    <a class="icon-link"></a>
  </div>

</footer>

</body>
</html>
